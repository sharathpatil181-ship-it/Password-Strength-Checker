<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Strength Checker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="card">
    <h1>Password Strength Checker</h1>

    <label for="password-input">Enter your password</label>
    <input
      type="password"
      id="password-input"
      placeholder="Type here..."
      autocomplete="off"
    >

    <ul id="rule-list">
      <li id="rule-length">At least 8 characters</li>
      <li id="rule-digit">At least one digit</li>
      <li id="rule-upper">At least one uppercase letter</li>
      <li id="rule-lower">At least one lowercase letter</li>
      <li id="rule-special">At least one special character (!@#$%^&amp;*.&lt;&gt;?)</li>
    </ul>

    <p id="result-message">Start typing to check your password</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
